[package]
name = "soroban-forge-test-utils"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared test utilities for Soroban Forge contracts"

[dependencies]
# `test-utils` exists only to support contract tests, so it always enables the
# Soroban SDK's test utilities (mock auth, address generation, ...).
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-forge-shared-utils = { path = "../shared-utils", version = "0.2.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    # audit-check publishes its result as a check run on the commit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allow-low: true
          deny-warnings: false
          # No ignores: the RUSTSEC-2026-0009 (`time`) advisory was cleared
          # by updating `time` to 0.3.47 in the lockfile after the SDK 27
          # migration. Warnings (e.g. transitive `paste` unmaintained) do
          # not fail this job while `deny-warnings` is false.

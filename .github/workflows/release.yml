name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build contracts to WASM
        run: |
          cargo build --locked --release --target wasm32v1-none \
            -p soroban-forge-escrow \
            -p soroban-forge-vesting \
            -p soroban-forge-multi-sig-wallet \
            -p soroban-forge-dao-governance \
            -p soroban-forge-subscription-payments \
            -p soroban-forge-marketplace-royalties
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            cp "$wasm" artifacts/
            echo "Built $(basename "$wasm")"
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::error::no WASM artifacts produced — release aborted"
            exit 1
          fi
      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-forge-wasm-${{ github.ref_name }}
          path: artifacts/*.wasm
          retention-days: 90
          compression-level: 9

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*.wasm

# The workspace tracks stable Rust: soroban-sdk 27.x compiles on current
# stable toolchains (the old 1.96.0 pin existed only for the SDK 21.x /
# ethnum 1.5.0 breakage, removed in the SDK 27 migration).
[toolchain]
channel  = "stable"
components = ["rustfmt", "clippy"]
profile  = "minimal"
targets  = ["wasm32v1-none"]

[toolchain.rust-analyzer]
rustfmt.overrideCommand = ["cargo", "fmt", "--"]
